<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Albero Genealogico Gallotta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0ede8;font-family:Georgia,serif;overflow:hidden;touch-action:none}
#title{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:22px;
  color:#2c2c2c;letter-spacing:.5px;text-shadow:1px 1px 3px rgba(255,255,255,.8);
  z-index:20;pointer-events:none}
#legend{position:fixed;top:52px;left:14px;background:rgba(255,255,255,.93);
  border:1px solid #ccc;border-radius:10px;padding:10px 14px;font-size:12px;
  z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#legend h4{margin-bottom:6px;font-size:13px;color:#333;font-weight:bold}
.li{display:flex;align-items:center;gap:7px;margin:4px 0;color:#444}
.ld{width:16px;height:14px;border-radius:3px;flex-shrink:0}
#controls{position:fixed;bottom:18px;right:18px;display:flex;gap:6px;z-index:20}
#controls button{width:38px;height:38px;border:1px solid #bbb;
  background:rgba(255,255,255,.9);border-radius:8px;cursor:pointer;
  font-size:15px;color:#555;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#controls button:hover{background:#fff;color:#222}
#autospace{width:auto!important;padding:0 10px;font-size:12px}
#tip{position:fixed;background:rgba(255,255,255,.97);border:1px solid #ccc;
  border-radius:9px;padding:7px 13px;font-size:12px;pointer-events:none;display:none;
  box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:100;max-width:220px}
#tc{width:100vw;height:100vh;overflow:hidden;user-select:none}
svg{width:100%;height:100%;display:block}
.marriage{stroke:#888;stroke-width:2;fill:none}
.conn{stroke:#888;stroke-width:1.8;fill:none}
.sec{stroke:#e74c3c;stroke-dasharray:6,4}
.pname{font-size:10px;font-family:Arial,sans-serif;font-weight:700;
  dominant-baseline:central;text-anchor:middle;fill:#1a1a1a;pointer-events:none}
.pnick{font-size:9px;font-family:Arial,sans-serif;font-weight:400;font-style:italic;
  dominant-baseline:central;text-anchor:middle;fill:#555;pointer-events:none}
.person{cursor:grab;filter:drop-shadow(1px 2px 3px rgba(0,0,0,.18));transition:filter .1s}
.person:active{cursor:grabbing;filter:drop-shadow(2px 4px 8px rgba(0,0,0,.35))}
</style>
</head>
<body>
<div id="title">Albero Genealogico Gallotta</div>
<div id="legend"><h4>Generazioni</h4><div class="li"><span class="ld" style="background:#f9d0cc;border:2px solid #c0392b"></span>Generazione 1</div><div class="li"><span class="ld" style="background:#cce3f5;border:2px solid #2471a3"></span>Generazione 2</div><div class="li"><span class="ld" style="background:#cdf0d8;border:2px solid #1e8449"></span>Generazione 3</div><div class="li"><span class="ld" style="background:#e4d4f4;border:2px solid #7d3c98"></span>Generazione 4</div><div class="li"><span class="ld" style="background:#fdf0cc;border:2px solid #d68910"></span>Generazione 5</div><div class="li" style="margin-top:7px;border-top:1px solid #eee;padding-top:5px"><svg width="26" height="10"><line x1="0" y1="5" x2="26" y2="5" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/></svg> Secondo matrimonio</div></div>
<div id="tip"></div>
<div id="controls">
  <button id="btn-zi"    title="Zoom +">+</button>
  <button id="btn-zo"    title="Zoom -">−</button>
  <button id="btn-fit"   title="Fit">⌂</button>
  <button id="autospace" title="Risolvi sovrapposizioni">Auto-spazio</button>
</div>
<div id="tc">
  <svg id="tree" xmlns="http://www.w3.org/2000/svg">
    <g id="canvas">
      <g id="conn-layer"></g>
      <g id="box-layer"></g>
    </g>
  </svg>
</div>
<script>
// ── Data from Python ──────────────────────────────────────────────────────────
const P       = {"1": {"label": "Ferdinando Gallotta", "nick": "", "gen": 1, "x": 3535.0, "y": 0}, "2": {"label": "Adalgisa Sartorius", "nick": "Gisa", "gen": 1, "x": 3695.0, "y": 0}, "3": {"label": "Anna Gallotta", "nick": "", "gen": 2, "x": 370.0, "y": 130}, "4": {"label": "Adriano Caprara", "nick": "", "gen": 2, "x": 530.0, "y": 130}, "5": {"label": "Fabrizio Caprara", "nick": "", "gen": 3, "x": 145.0, "y": 260}, "6": {"label": "Nicoletta Prevost", "nick": "", "gen": 3, "x": 305.0, "y": 260}, "7": {"label": "Adriano Caprara", "nick": "", "gen": 4, "x": 112.5, "y": 390}, "8": {"label": "Marina Caprara", "nick": "", "gen": 4, "x": 337.5, "y": 390}, "9": {"label": "Maurizio Caprara", "nick": "", "gen": 3, "x": 595.0, "y": 260}, "10": {"label": "Sabina Felici", "nick": "", "gen": 3, "x": 755.0, "y": 260}, "11": {"label": "Flaminia Caprara", "nick": "", "gen": 4, "x": 562.5, "y": 390}, "12": {"label": "Giulio Caprara", "nick": "", "gen": 4, "x": 787.5, "y": 390}, "13": {"label": "Emilia Gallotta", "nick": "", "gen": 2, "x": 1800.0, "y": 130}, "14": {"label": "Antonio De Simone", "nick": "", "gen": 2, "x": 1960.0, "y": 130}, "15": {"label": "Daniela De Simone", "nick": "", "gen": 3, "x": 1157.5, "y": 260}, "16": {"label": "Mariano Serra", "nick": "", "gen": 3, "x": 1317.5, "y": 260}, "17": {"label": "Francesca Serra", "nick": "", "gen": 4, "x": 1045.0, "y": 390}, "18": {"label": "Matteo Sironi", "nick": "", "gen": 4, "x": 1205.0, "y": 390}, "19": {"label": "Arturo Sironi", "nick": "", "gen": 5, "x": 1012.5, "y": 520}, "20": {"label": "Bernardo Sironi", "nick": "", "gen": 5, "x": 1237.5, "y": 520}, "21": {"label": "Eugenio Serra", "nick": "", "gen": 4, "x": 1462.5, "y": 390}, "22": {"label": "Roberto De Simone", "nick": "", "gen": 3, "x": 1720.0, "y": 260}, "23": {"label": "Fausta Pasanisi", "nick": "", "gen": 3, "x": 1880.0, "y": 260}, "24": {"label": "Emilia De Simone", "nick": "", "gen": 4, "x": 1687.5, "y": 390}, "25": {"label": "Edoardo De Simone", "nick": "", "gen": 4, "x": 1912.5, "y": 390}, "26": {"label": "Bruno De Simone", "nick": "", "gen": 3, "x": 2170.0, "y": 260}, "27": {"label": "Valeria Gargiulo", "nick": "", "gen": 3, "x": 2330.0, "y": 260}, "28": {"label": "Ferdinando De Simone", "nick": "", "gen": 4, "x": 1945.0, "y": 390}, "29": {"label": "Antonio De Simone", "nick": "", "gen": 4, "x": 2170.0, "y": 390}, "30": {"label": "Angela Caruso", "nick": "", "gen": 3, "x": 2555.0, "y": 260}, "31": {"label": "Lorenzo De Simone", "nick": "", "gen": 4, "x": 2362.5, "y": 390}, "32": {"label": "Pasquale Gallotta", "nick": "Daddà", "gen": 2, "x": 3455.0, "y": 130}, "33": {"label": "Marisa Catalano", "nick": "", "gen": 2, "x": 3615.0, "y": 130}, "34": {"label": "Federica Gallotta", "nick": "", "gen": 3, "x": 3005.0, "y": 260}, "35": {"label": "Bernardo Magrì", "nick": "", "gen": 3, "x": 3165.0, "y": 260}, "36": {"label": "Ennio Magrì", "nick": "", "gen": 4, "x": 2972.5, "y": 390}, "37": {"label": "Beatrice Magrì", "nick": "", "gen": 4, "x": 3197.5, "y": 390}, "38": {"label": "Marcella Gallotta", "nick": "", "gen": 3, "x": 3422.5, "y": 260}, "39": {"label": "Fernanda Gallotta", "nick": "", "gen": 3, "x": 3792.5, "y": 260}, "40": {"label": "Rino Fiore", "nick": "", "gen": 3, "x": 3952.5, "y": 260}, "41": {"label": "Federica Fiore", "nick": "", "gen": 4, "x": 3647.5, "y": 390}, "42": {"label": "Giovanni Fiore", "nick": "", "gen": 4, "x": 3872.5, "y": 390}, "43": {"label": "Riccardo Fiore", "nick": "", "gen": 4, "x": 4097.5, "y": 390}, "44": {"label": "Bruno Gallotta", "nick": "", "gen": 2, "x": 5030.0, "y": 130}, "45": {"label": "Rosellina Attena", "nick": "", "gen": 2, "x": 5190.0, "y": 130}, "46": {"label": "Fernando Gallotta", "nick": "", "gen": 3, "x": 4355.0, "y": 260}, "47": {"label": "Paola Biancogiglio", "nick": "", "gen": 3, "x": 4515.0, "y": 260}, "48": {"label": "Bruno Gallotta", "nick": "", "gen": 4, "x": 4322.5, "y": 390}, "49": {"label": "Roberta Gallotta", "nick": "", "gen": 4, "x": 4547.5, "y": 390}, "50": {"label": "Gisella Gallotta", "nick": "", "gen": 3, "x": 4917.5, "y": 260}, "51": {"label": "Aurelio Dalla Vecchia", "nick": "", "gen": 3, "x": 5077.5, "y": 260}, "52": {"label": "Giuseppe Dalla Vecchia", "nick": "", "gen": 4, "x": 4772.5, "y": 390}, "53": {"label": "Giovanni Dalla Vecchia", "nick": "", "gen": 4, "x": 4997.5, "y": 390}, "54": {"label": "Pietro Dalla Vecchia", "nick": "", "gen": 4, "x": 5222.5, "y": 390}, "55": {"label": "Massimo Gallotta", "nick": "", "gen": 3, "x": 5592.5, "y": 260}, "56": {"label": "Giggiola Ferraro", "nick": "", "gen": 3, "x": 5752.5, "y": 260}, "57": {"label": "Riccardo Gallotta", "nick": "", "gen": 4, "x": 5447.5, "y": 390}, "58": {"label": "Mauro Gallotta", "nick": "", "gen": 4, "x": 5672.5, "y": 390}, "59": {"label": "Rosa Gallotta", "nick": "", "gen": 4, "x": 5897.5, "y": 390}, "60": {"label": "Marina Gallotta", "nick": "", "gen": 2, "x": 6347.5, "y": 130}, "61": {"label": "Andrea Attena", "nick": "", "gen": 2, "x": 6507.5, "y": 130}, "62": {"label": "Azzurra Attena", "nick": "", "gen": 3, "x": 6155.0, "y": 260}, "63": {"label": "Marcello Esposito", "nick": "", "gen": 3, "x": 6315.0, "y": 260}, "64": {"label": "Giordana Esposito", "nick": "", "gen": 4, "x": 6122.5, "y": 390}, "65": {"label": "Andrea Esposito", "nick": "", "gen": 4, "x": 6347.5, "y": 390}, "66": {"label": "Carolina Attena", "nick": "", "gen": 3, "x": 6572.5, "y": 260}, "67": {"label": "Stefano Sorgente", "nick": "", "gen": 3, "x": 6732.5, "y": 260}, "68": {"label": "Arturo Sorgente", "nick": "", "gen": 4, "x": 6652.5, "y": 390}, "69": {"label": "Rossana Gallotta", "nick": "Ro", "gen": 2, "x": 6957.5, "y": 130}, "70": {"label": "Enzo Vignola", "nick": "", "gen": 2, "x": 7117.5, "y": 130}, "71": {"label": "Luca Vignola", "nick": "", "gen": 3, "x": 6957.5, "y": 260}, "72": {"label": "Vincenza Leone", "nick": "", "gen": 3, "x": 7117.5, "y": 260}, "73": {"label": "Virginia Vignola", "nick": "", "gen": 4, "x": 7037.5, "y": 390}};
const COUPLES = [{"id": "m1_2", "p1": 1, "p2": 2, "children": [3, 13, 32, 44, 60, 69], "secondary": false}, {"id": "m3_4", "p1": 3, "p2": 4, "children": [5, 9], "secondary": false}, {"id": "m5_6", "p1": 5, "p2": 6, "children": [7, 8], "secondary": false}, {"id": "m9_10", "p1": 9, "p2": 10, "children": [11, 12], "secondary": false}, {"id": "m13_14", "p1": 13, "p2": 14, "children": [15, 22, 26], "secondary": false}, {"id": "m15_16", "p1": 15, "p2": 16, "children": [17, 21], "secondary": false}, {"id": "m17_18", "p1": 17, "p2": 18, "children": [19, 20], "secondary": false}, {"id": "m22_23", "p1": 22, "p2": 23, "children": [24, 25], "secondary": false}, {"id": "m26_27", "p1": 26, "p2": 27, "children": [28, 29], "secondary": false}, {"id": "m26_30", "p1": 26, "p2": 30, "children": [31], "secondary": true}, {"id": "m32_33", "p1": 32, "p2": 33, "children": [34, 38, 39], "secondary": false}, {"id": "m34_35", "p1": 34, "p2": 35, "children": [36, 37], "secondary": false}, {"id": "m39_40", "p1": 39, "p2": 40, "children": [41, 42, 43], "secondary": false}, {"id": "m44_45", "p1": 44, "p2": 45, "children": [46, 50, 55], "secondary": false}, {"id": "m46_47", "p1": 46, "p2": 47, "children": [48, 49], "secondary": false}, {"id": "m50_51", "p1": 50, "p2": 51, "children": [52, 53, 54], "secondary": false}, {"id": "m55_56", "p1": 55, "p2": 56, "children": [57, 58, 59], "secondary": false}, {"id": "m60_61", "p1": 60, "p2": 61, "children": [62, 66], "secondary": false}, {"id": "m62_63", "p1": 62, "p2": 63, "children": [64, 65], "secondary": false}, {"id": "m66_67", "p1": 66, "p2": 67, "children": [68], "secondary": false}, {"id": "m69_70", "p1": 69, "p2": 70, "children": [71], "secondary": false}, {"id": "m71_72", "p1": 71, "p2": 72, "children": [73], "secondary": false}];
const GEN_META= {"1": {"fill": "#f9d0cc", "stroke": "#c0392b", "label": "Generazione 1"}, "2": {"fill": "#cce3f5", "stroke": "#2471a3", "label": "Generazione 2"}, "3": {"fill": "#cdf0d8", "stroke": "#1e8449", "label": "Generazione 3"}, "4": {"fill": "#e4d4f4", "stroke": "#7d3c98", "label": "Generazione 4"}, "5": {"fill": "#fdf0cc", "stroke": "#d68910", "label": "Generazione 5"}};
const BOX_W=130, BOX_H=44, DROP=16;

// ── SVG helpers ───────────────────────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
const connL = document.getElementById('conn-layer');
const boxL  = document.getElementById('box-layer');

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  connL.innerHTML=''; boxL.innerHTML='';
  for(const c of COUPLES) drawCouple(c);
  for(const pid of Object.keys(P)) drawBox(pid);
}

function drawCouple(c){
  const {id,p1,p2,children,secondary} = c;
  const cls = secondary ? 'sec' : '';
  const d1=P[p1], d2=P[p2];
  if(!d1||!d2) return;

  // Marriage line between the two box edges
  const lx = Math.min(d1.x,d2.x)+BOX_W/2;
  const rx = Math.max(d1.x,d2.x)-BOX_W/2;
  const my = (d1.y+d2.y)/2;
  if(rx>lx) connL.appendChild(el('line',{x1:lx,y1:my,x2:rx,y2:my,class:`marriage ${cls}`}));

  if(!children.length) return;
  const pmx=(d1.x+d2.x)/2, pmy=d1.y;
  const dropY=pmy+BOX_H/2+DROP;

  // Short vertical stub from couple midpoint to horizontal bar
  connL.appendChild(el('line',{x1:pmx,y1:pmy+BOX_H/2,x2:pmx,y2:dropY,class:`conn ${cls}`}));

  // Horizontal bar spanning all direct children
  const cxs=children.map(k=>P[k]?.x).filter(x=>x!=null).sort((a,b)=>a-b);
  if(cxs.length>1)
    connL.appendChild(el('line',{x1:cxs[0],y1:dropY,x2:cxs.at(-1),y2:dropY,class:`conn ${cls}`}));

  // Vertical lines from bar to each child's box top
  for(const k of children){
    const pk=P[k]; if(!pk) continue;
    connL.appendChild(el('line',{x1:pk.x,y1:dropY,x2:pk.x,y2:pk.y-BOX_H/2,class:`conn ${cls}`}));
  }
}

function drawBox(pid){
  const p=P[pid], gm=GEN_META[p.gen];
  const g=el('g',{class:'person','data-pid':pid});
  g.appendChild(el('rect',{
    x:p.x-BOX_W/2, y:p.y-BOX_H/2, width:BOX_W, height:BOX_H,
    rx:8, ry:8, fill:gm.fill, stroke:gm.stroke, 'stroke-width':2
  }));
  if(p.nick){
    const t1=el('text',{x:p.x,y:p.y-8,class:'pname'}); t1.textContent=p.label; g.appendChild(t1);
    const t2=el('text',{x:p.x,y:p.y+9,class:'pnick'}); t2.textContent=`"${p.nick}"`; g.appendChild(t2);
  }else{
    const t=el('text',{x:p.x,y:p.y,class:'pname'}); t.textContent=p.label; g.appendChild(t);
  }
  g.addEventListener('mouseenter', e=>showTip(e,pid));
  g.addEventListener('mousemove',  e=>moveTip(e));
  g.addEventListener('mouseleave', hideTip);
  boxL.appendChild(g);
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tip=document.getElementById('tip');
function showTip(e,pid){
  const p=P[pid], gm=GEN_META[p.gen];
  tip.innerHTML=`<b style="color:${gm.stroke}">${p.label}</b>`+
    (p.nick?`<br><i>"${p.nick}"</i>`:'') +
    `<br><span style="color:#777">Gen.${p.gen}</span>`;
  tip.style.display='block'; moveTip(e);
}
function moveTip(e){tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';}
function hideTip(){tip.style.display='none';}

// ── Zoom / pan ────────────────────────────────────────────────────────────────
const tc=document.getElementById('tc');
const canvas=document.getElementById('canvas');
let scale=1,tx=0,ty=0;
function applyT(){canvas.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}

function zoom(f,cx,cy){
  cx=cx??tc.clientWidth/2; cy=cy??tc.clientHeight/2;
  const ns=Math.min(Math.max(scale*f,.06),6);
  tx=cx-(cx-tx)*(ns/scale); ty=cy-(cy-ty)*(ns/scale); scale=ns; applyT();
}
function fitView(){
  const xs=Object.values(P).map(p=>p.x);
  const ys=Object.values(P).map(p=>p.y);
  const vw=tc.clientWidth, vh=tc.clientHeight;
  const pad=70;
  const tw=Math.max(...xs)-Math.min(...xs)+BOX_W+pad*2;
  const th=Math.max(...ys)-Math.min(...ys)+BOX_H+pad*2;
  scale=Math.min(vw/tw,vh/th)*.93;
  tx=(vw-(Math.max(...xs)+Math.min(...xs))*scale)/2;
  ty=(vh-(Math.max(...ys)+Math.min(...ys))*scale)/2;
  applyT();
}

tc.addEventListener('wheel',e=>{
  e.preventDefault(); zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY);
},{passive:false});

document.getElementById('btn-zi').onclick=()=>zoom(1.25);
document.getElementById('btn-zo').onclick=()=>zoom(.8);
document.getElementById('btn-fit').onclick=fitView;

// ── Drag / pan ────────────────────────────────────────────────────────────────
let dragPid=null,dragStart=null,isPan=false,panStart=null,rafId=null;

function toSVG(cx,cy){
  const m=canvas.getScreenCTM().inverse();
  return {x:cx*m.a+cy*m.c+m.e, y:cx*m.b+cy*m.d+m.f};
}

tc.addEventListener('pointerdown',e=>{
  const pg=e.target.closest('.person');
  if(pg){
    dragPid=pg.dataset.pid;
    const sv=toSVG(e.clientX,e.clientY);
    dragStart={mx:sv.x,my:sv.y,ox:P[dragPid].x,oy:P[dragPid].y};
    tc.setPointerCapture(e.pointerId);
  }else{
    isPan=true; panStart={x:e.clientX,y:e.clientY,tx,ty};
    tc.setPointerCapture(e.pointerId);
  }
});

tc.addEventListener('pointermove',e=>{
  if(dragPid){
    const sv=toSVG(e.clientX,e.clientY);
    P[dragPid].x=dragStart.ox+(sv.x-dragStart.mx);
    P[dragPid].y=dragStart.oy+(sv.y-dragStart.my);
    if(!rafId) rafId=requestAnimationFrame(()=>{render();rafId=null;});
  }else if(isPan){
    tx=panStart.tx+(e.clientX-panStart.x);
    ty=panStart.ty+(e.clientY-panStart.y);
    applyT();
  }
});

tc.addEventListener('pointerup',e=>{
  dragPid=null; dragStart=null; isPan=false; panStart=null;
  tc.releasePointerCapture(e.pointerId);
});

// ── Auto-space ────────────────────────────────────────────────────────────────
document.getElementById('autospace').onclick=autoSpace;

function autoSpace(){
  const byY={};
  for(const[pid,p] of Object.entries(P)){
    const k=Math.round(p.y); (byY[k]||(byY[k]=[])).push(pid);
  }
  const MIN=BOX_W+8;
  for(const pids of Object.values(byY)){
    pids.sort((a,b)=>P[a].x-P[b].x);
    // Forward pass: push right
    for(let i=1;i<pids.length;i++){
      if(P[pids[i]].x-P[pids[i-1]].x<MIN)
        P[pids[i]].x=P[pids[i-1]].x+MIN;
    }
    // Backward pass: push left
    for(let i=pids.length-2;i>=0;i--){
      if(P[pids[i+1]].x-P[pids[i]].x<MIN)
        P[pids[i]].x=P[pids[i+1]].x-MIN;
    }
  }
  render(); fitView();
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
autoSpace();   // resolve any initial overlaps, then fit
</script>
